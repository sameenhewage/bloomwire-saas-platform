name: Bloomwire Build Image

on:
  workflow_dispatch:
  push:
    branches:
      - version_1

permissions:
  contents: read
  packages: write

concurrency:
  group: bloomwire-build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/docker/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/sameenhewage/bloomwire-app:${{ github.sha }}
            ghcr.io/sameenhewage/bloomwire-app:version_1
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
